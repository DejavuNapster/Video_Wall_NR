# Rekonstruksi dari README + source (file asli hilang di region korup ZIP).
# Sumber fakta: README.md, package.json, src/main/sidecar.ts (binaryPath -> resourcePath('bin', 'mediamtx(.exe)')).
# appId TETAP sama walau nama aplikasi diganti: installer memperbarui instalasi lama, bukan memasang aplikasi kedua.
appId: itsupport.videowallbrowser
productName: Video Wall NR
copyright: Copyright © 2026 Video Wall NR
# electron, electron-builder versi diambil otomatis dari package.json.

directories:
  buildResources: build
  output: dist

# Hanya hasil build electron-vite (out/) yang masuk asar.
# Source, tests, .git, dll TIDAK ikut (biar paket bersih).
files:
  - out/**
  - package.json

# Sidecar MediaMTX (RTSP -> WebRTC/HLS) di-bundle ke <resources>/bin/,
# sehingga resourcePath('bin','mediamtx'/'mediamtx.exe') di main menemukan binary.
# Dipisah per-platform (di blok win/ linux/ di bawah) agar TIAP installer hanya
# memuat binary OS targetnya, BUKAN semua isi resources/bin.

asarUnpack:
  - resources/bin/**

# macOS: tanda tangan ad-hoc sebelum dmg/zip dibuat (lihat build/afterPack.cjs).
afterPack: build/afterPack.cjs

# ---- Toolsets (hanya dipakai bila build Windows dari host Linux) ----
# electron-builder 26.x: wine "0.0.0" (default) = pakai wine SISTEM (butuh
# install wine + arsitektur i386). Kita pakai bundle wine 11 self-contained
# (ia32 via WoW64) yang diunduh dari GitHub electron-builder-binaries, agar
# build NSIS di container headless tanpa install wine sistem manual.
# Rujukan: https://github.com/electron-userland/electron-builder-binaries/releases
toolsets:
  wine: "1.0.1"

# ---- Windows (.exe) ----
win:
  executableName: video-wall-browser
  icon: build/icon.ico
  # Nama file rilis: Video_Wall_NR_v<versi>_<OS>_<arsitektur>[_jenis].<ext>
  artifactName: Video_Wall_NR_v${version}_Windows_${arch}_Setup.${ext}
  # Sidecar MediaMTX Windows — hanya mediamtx.exe (bukan binary Linux).
  extraResources:
    - from: resources/bin
      to: bin
      filter:
        - "mediamtx.exe"
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Video Wall NR
  # Autostart Windows: via per-machine install + shortcut (lihat README "Autostart Windows").
  # (Kode autostart di main memakai app.setLoginItemSettings saat runtime.)

# Portable: nama TERPISAH dari installer NSIS (nama sama = portable menimpa installer).
portable:
  artifactName: Video_Wall_NR_v${version}_Windows_${arch}_Portable.${ext}

# ---- macOS (dmg + zip, Intel x64 + Apple Silicon arm64) ----
# Dibangun di runner macOS GitHub Actions (.github/workflows/release.yml).
#   - identity: null → tanpa sertifikat Apple Developer ID; build/afterPack.cjs memberi tanda tangan
#     ad-hoc agar app bisa dijalankan di Apple Silicon. Gatekeeper tetap memperingatkan app unsigned:
#     buka lewat klik-kanan → Open, atau `xattr -cr "/Applications/Video Wall NR.app"`.
#   - MediaMTX darwin per arsitektur di resources/bin-darwin-<arch>/ (npm run fetch:mediamtx dengan
#     MEDIAMTX_PLATFORM=darwin MEDIAMTX_ARCH=x64|arm64); ${arch} diganti electron-builder saat packaging.
#   - icon: build/icon.png (512x512) — dikonversi ke .icns otomatis.
mac:
  category: public.app-category.video
  identity: null
  hardenedRuntime: false
  icon: build/icon.png
  artifactName: Video_Wall_NR_v${version}_macOS_${arch}.${ext}
  extraResources:
    - from: resources/bin-darwin-${arch}
      to: bin
      filter:
        - mediamtx
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

dmg:
  backgroundColor: "#f5f5f7"

# ---- Linux (installer) ----
linux:
  icon: build/icon.png
  category: Multimedia
  synopsis: Video wall multi-monitor (web + video)
  artifactName: Video_Wall_NR_v${version}_Linux_${arch}.${ext}
  # Sidecar MediaMTX Linux — hanya mediamtx (bukan .exe).
  extraResources:
    - from: resources/bin
      to: bin
      filter:
        - "mediamtx"
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]

# AppImage: SUID sandbox Chromium (dibutuhkan agar VA-API/GPU decode jalan di kiosk)
# adalah kekhawatiran RUNTIME, BUKAN opsi electron-builder. `appImage` di
# electron-builder 26.x hanya menerima: license, compression, artifactName,
# executableName, category. (Opsi `useSystemSandbox` TIDAK valid — membuat
# validasi config gagal.) Di runtime kiosk: Electron AppImage memuat
# chrome-sandbox SUID; bila target tidak punya SUID, jalankan dengan `--no-sandbox`.

# Tidak publish ke anywhere (build lokal / internal).
publish: null
